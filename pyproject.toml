[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gbm-manifest"
version = "0.1.0"
requires-python = ">=3.11"
# Core: what gbm_os needs to select a cohort and resolve paths. A consumer who
# only reads the manifest should not be made to install the pipeline's CLI,
# its parquet writer, or a NIfTI reader.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Running the manifest pipeline itself (gbm_manifest).
pipeline = [
    "typer>=0.9",
    "pyyaml>=6.0.3",
    "pyarrow>=14.0",
    "nibabel>=5.0",
]
# Reading volumes off disk from a selected cohort.
load = ["nibabel>=5.0"]
# Framework backends. On a CUDA host install torch first with the matching
# build, then these resolve against it:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
torch = ["torch>=2.0"]
monai = ["monai>=1.3"]
torchio = ["torchio>=0.19"]
all = [
    "typer>=0.9", "pyyaml>=6.0.3", "pyarrow>=14.0",
    "nibabel>=5.0", "torch>=2.0", "monai>=1.3", "torchio>=0.19",
]

[project.scripts]
gbm-manifest = "gbm_manifest.cli:app"
manifest = "gbm_manifest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gbm_manifest", "gbm_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ipykernel>=7.3.0",
]
