[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gliostitch"
version = "0.1.0"
description = "Reproducible cohort selection over public glioma MRI datasets"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "glioblastoma", "neuro-oncology", "medical-imaging", "mri",
    "survival-analysis", "reproducibility", "cohort-selection",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Lim Wei Xin (Davian)", email = "limweixin17@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

# Core: what gbm_os needs to select a cohort and resolve paths. A consumer who
# only reads the manifest should not be made to install the pipeline's CLI,
# its parquet writer, or a NIfTI reader.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/realdavian/gbm-surv-data-pipeline"
Repository = "https://github.com/realdavian/gbm-surv-data-pipeline"
Changelog = "https://github.com/realdavian/gbm-surv-data-pipeline/blob/main/CHANGELOG.md"
Issues = "https://github.com/realdavian/gbm-surv-data-pipeline/issues"

[project.optional-dependencies]
# Running the manifest pipeline itself (gbm_manifest).
pipeline = [
    "typer>=0.9",
    "pyyaml>=6.0.3",
    "pyarrow>=14.0",
    "nibabel>=5.0",
]
# Reading volumes off disk from a selected cohort.
load = ["nibabel>=5.0"]
# Framework backends. On a CUDA host install torch first with the matching
# build, then these resolve against it:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
torch = ["torch>=2.0"]
monai = ["monai>=1.3"]
torchio = ["torchio>=0.19"]
all = [
    "typer>=0.9", "pyyaml>=6.0.3", "pyarrow>=14.0",
    "nibabel>=5.0", "torch>=2.0", "monai>=1.3", "torchio>=0.19",
]

[project.scripts]
# One command only. The previous `manifest` alias was far too generic to put on
# a stranger's PATH — it would shadow or be shadowed by anything else named
# `manifest`.
gliostitch = "gbm_manifest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gbm_manifest", "gbm_os"]

[tool.hatch.build.targets.sdist]
# What a user downloading the source distribution gets. Developer docs, tests,
# notebooks and generated output are deliberately excluded — they are part of
# working on the project, not of using it.
include = [
    "gbm_manifest",
    "gbm_os",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ipykernel>=7.3.0",
]
