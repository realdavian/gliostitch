[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gbm-manifest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "nibabel>=5.0",
    "typer>=0.9",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
load = ["nibabel>=5.0"]
# torch must be installed first with the correct CUDA build before these extras:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
monai = ["monai>=1.3"]
torchio = ["torchio>=0.19"]
all = ["nibabel>=5.0", "monai>=1.3", "torchio>=0.19"]

[project.scripts]
gbm-manifest = "gbm_manifest.cli:app"
manifest = "gbm_manifest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["gbm_manifest", "gbm_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]
