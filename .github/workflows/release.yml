name: Release

# Builds, tests and publishes a tagged version to PyPI. Two ways in:
#
#   1. A human pushes a tag directly:
#        git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
#   2. release-please.yml DISPATCHES this workflow (workflow_dispatch) the
#      moment it creates a release, passing the tag it just cut.
#
# (2) is a dispatch, not a reliance on `on: push: tags`, because GitHub does
# not fire tag-push workflows for a tag pushed with the default GITHUB_TOKEN
# (deliberate loop prevention) — which is exactly how v0.1.1 got tagged and
# "released" on GitHub while silently never reaching PyPI, every workflow
# green. workflow_dispatch is GitHub's documented exception: it always creates
# a run even when invoked with GITHUB_TOKEN.
#
# It is a dispatch rather than a reusable `workflow_call` for a second reason:
# PyPI Trusted Publishing rejects publishes from reusable workflows (the
# uploaded PEP 740 attestations fail verification — the token's identity is the
# reusable workflow, not a top-level one). Dispatching keeps this workflow
# TOP-LEVEL, so job_workflow_ref == workflow_ref == release.yml and both the
# OIDC mint and the attestations verify. See docs.pypi.org/trusted-publishers/
# troubleshooting/#reusable-workflows-on-github.
#
# Authentication uses PyPI Trusted Publishing (OpenID Connect) — no API token
# is stored anywhere. Configure it once at
# https://pypi.org/manage/account/publishing/ with: owner realdavian, repo
# gliostitch, workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.1.0"
        required: true
        type: string
      skip_github_release:
        description: "Skip creating the GitHub release (use if one already exists for this tag)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Never publish something that has not been tested. This duplicates CI
  # rather than trusting that CI ran on the tagged commit — and duplicates it
  # again here rather than trusting the caller, since the caller is sometimes
  # a bot that cannot itself have run the suite against this exact tag.
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[pipeline]" pytest
      - run: pytest -q

  build:
    name: build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the packaged version
        # A tag that disagrees with pyproject publishes a version nobody can
        # reproduce from the repository.
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          PKG=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG  pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gliostitch
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: attach artifacts to the GitHub release
    needs: publish
    # release-please already creates the GitHub release when it cuts the tag;
    # this job only runs for a manually-pushed tag, where nothing has.
    if: ${{ inputs.skip_github_release != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create a release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed in this release."

  confirm:
    name: confirm PyPI actually has it
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Poll PyPI for the published version
        # publish reporting "success" means the upload API call returned 200 —
        # it does not by itself prove the package is retrievable. Confirm it
        # against the real index rather than trusting the step outcome, since
        # trusting workflow success is exactly what hid the v0.1.1 gap.
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          for i in $(seq 1 10); do
            if curl -fsS "https://pypi.org/pypi/gliostitch/$VERSION/json" >/dev/null 2>&1; then
              echo "Confirmed: gliostitch $VERSION is live on PyPI."
              exit 0
            fi
            echo "Not visible yet (attempt $i/10), waiting..."
            sleep 15
          done
          echo "::error::gliostitch $VERSION did not become visible on PyPI after publish reported success."
          exit 1
