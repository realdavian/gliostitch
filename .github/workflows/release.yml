name: Release

# Publishes to PyPI when a version tag is pushed, e.g.:
#
#     git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Authentication uses PyPI Trusted Publishing (OpenID Connect) — no API token is
# stored anywhere. Configure it once at https://pypi.org/manage/account/publishing/
# with: owner realdavian, repo gbm-surv-data-pipeline, workflow release.yml,
# environment pypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Never publish something that has not been tested. This duplicates CI rather
  # than trusting that CI ran on the tagged commit.
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[pipeline]" pytest
      - run: pytest -q

  build:
    name: build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the packaged version
        # A tag that disagrees with pyproject publishes a version nobody can
        # reproduce from the repository.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG  pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gliostitch
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: attach artifacts to the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Zenodo watches GitHub releases: once the repo is public and the Zenodo
        # integration is enabled, this step is what mints the DOI.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed in this release."
