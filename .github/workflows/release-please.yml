name: Release Please

# Maintains a standing "release PR" against main. Every push to main updates it
# with the version bump and changelog entries implied by the Conventional Commit
# messages since the last release. Merging that PR creates the tag and the
# GitHub release, which this workflow then dispatches release.yml to publish.
#
# The hand-off is an explicit workflow_dispatch (see the publish job) rather
# than relying on the tag push to retrigger release.yml. It can't: GitHub does
# not fire tag-push workflows for a push made with the default GITHUB_TOKEN,
# which is what release-please-action uses — deliberate loop prevention.
# workflow_dispatch is the documented exception (it always fires), and it keeps
# release.yml top-level, which PyPI Trusted Publishing requires. Before this
# was wired up, merging the release PR tagged and "released" on GitHub while
# silently never reaching PyPI, every step green. v0.1.1 shipped that way.
#
# The release PR itself is still the human checkpoint this project's
# versioning policy needs: a change that moves a cohort count is MINOR at
# minimum even when committed as `fix:`, which no tool can infer from a
# subject line. See developer-docs/04_versioning.md.
#
# To force a version the commit types would not produce, add to a commit
# footer or the release PR body:
#
#     Release-As: 0.2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarise
        if: always()
        env:
          RELEASED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "Released **$TAG** — dispatching release.yml to build and publish to PyPI." >> $GITHUB_STEP_SUMMARY
          elif [ -n "$PR" ]; then
            echo "Release PR updated. Merge it to cut a release." >> $GITHUB_STEP_SUMMARY
          else
            echo "No releasable changes since the last tag." >> $GITHUB_STEP_SUMMARY
          fi

  publish:
    name: dispatch release.yml to publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Only actions:write — enough to dispatch. The publish itself (OIDC,
    # contents:write for the GitHub release) is release.yml's own concern; it
    # runs top-level, with its own permissions, not as a called workflow.
    permissions:
      actions: write
    steps:
      - name: Dispatch release.yml for the tag release-please just cut
        # workflow_dispatch (not workflow_call): it always fires even from
        # GITHUB_TOKEN, and it keeps release.yml top-level so PyPI Trusted
        # Publishing accepts it (a reusable workflow_call fails attestation
        # verification). skip_github_release: release-please already made the
        # GitHub release for this tag.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "$TAG" \
            -f tag="$TAG" \
            -f skip_github_release=true
